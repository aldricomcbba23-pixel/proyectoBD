# =============================================================================
# CONFIGURACIÓN DE POSTGREST (postgrest.conf)
# Base de datos: bd_bar (administrada en pgAdmin 4)
# =============================================================================

# Cadena de conexión URI a PostgreSQL:
# Formato: postgresql://[usuario]:[contraseña]@[servidor]:[puerto]/[base_de_datos]
db-uri = "postgresql://postgres:2020@localhost:5432/bd_bar"

# Esquema de base de datos expuesto
db-schemas = "public"

# Rol asignado a las peticiones del frontend web (sin autenticación JWT)
db-anon-role = "web_anon"

# Dirección y puerto donde escucha la API REST
server-host = "0.0.0.0"
server-port = 3000

# Política CORS: PostgREST por defecto permite todos los orígenes (*) automáticamente.
# No definir server-cors-allowed-origins para que acepte tanto peticiones locales (file://, localhost) como remotas.

# Nivel de log del servidor
log-level = "info"

# Pool de conexiones a PostgreSQL
db-pool = 10
db-pool-timeout = 10
